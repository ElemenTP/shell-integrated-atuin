[package]
name = "atuin-ffi"
version = "0.1.0"
edition = "2024"
description = "C FFI bindings for Atuin shell history — in-process shell integration"
license = "MIT"

[lib]
name = "atuin_ffi"
crate-type = ["cdylib"]

[dependencies]
atuin-client = { path = "../atuin/crates/atuin-client", default-features = false, features = ["daemon", "in-process"] }
atuin-common = { path = "../atuin/crates/atuin-common" }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
